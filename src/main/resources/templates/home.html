<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Главная страница</title>
    <style>
        /* Верхняя навигация */
        .navbar-custom {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        .navbar-brand, .nav-link {
            color: #fff !important;
        }
        .navbar-brand:hover, .nav-link:hover {
            color: #f0f0f0 !important;
        }
        /* Основной контейнер */
        .container {
            padding-top: 20px;
        }
        /* Футер */
        .footer {
            background-color: #343a40;
            color: #ced4da;
            padding: 40px 0;
            border-top: 1px solid #6c757d;
        }
        .footer h5 {
            color: #f8f9fa;
            margin-bottom: 15px;
        }
        .footer a {
            color: #ced4da;
            text-decoration: none;
        }
        .footer a:hover {
            color: #8f94fb;
        }
        .social-icons a {
            color: #ced4da;
            margin-right: 15px;
            font-size: 20px;
        }
        .social-icons a:hover {
            color: #8f94fb;
        }
    </style>
</head>
<body>

<!-- Верхнее меню -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand" href="/">Магазин одежды</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link" href="/cart">Корзина</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/orders">Ваши заказы</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/login">Войти в другой аккаунт</a>
            </li>
        </ul>
    </div>
</nav>

<!-- Основной контент -->
<div class="container mt-4">
    <h1>Все товары</h1>
    <div class="row">
        <div class="col-md-4" th:each="product, iterStat : ${products}">
            <div class="card mb-4">
                <img class="card-img-top" th:src="${product.imageUrl}" alt="Изображение товара">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}"></h5>
                    <p class="card-text" th:text="${product.description}"></p>
                    <p class="card-text" th:text="'Цена: $' + ${product.price}"></p>
                    <p class="card-text">Размер: <span th:text="${sizes[iterStat.index].sizeValue}"></span></p>
                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}"/>
                        <input type="hidden" name="sizeId" th:value="${sizes[iterStat.index].id}"/>
                        <button class="btn btn-primary">Добавить в корзину</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
